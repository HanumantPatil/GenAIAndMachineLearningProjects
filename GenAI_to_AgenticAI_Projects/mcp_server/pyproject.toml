[project]
name = "mcp-server"
version = "0.1.0"
description = "An MCP server for managing employee leave requests and balances"
readme = "README.md"
authors = [
    { name = "Hanumant Patil", email = "hapatil@microsoft.com" }
]
requires-python = ">=3.12"
dependencies = ["mcp[cli]>=2.1,<3"]

[project.scripts]
mcp-server = "mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "microsoft-proxy"
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true
